name: offline-runtime-diagnostics
on:
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Prepare verified runtime installer and compiled application
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38164937632 -R gongfpp/config-reviewer-builds -n config-reviewer-windows-offline -D downloaded
          if ($LASTEXITCODE -ne 0) { throw 'Application download failed' }
          Expand-Archive (Get-ChildItem downloaded/*.zip).FullName C:/ReviewerRuntime
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/?linkid=2124701' -UseBasicParsing -OutFile C:/ReviewerRuntime/WebView2.exe
          if ((Get-FileHash C:/ReviewerRuntime/WebView2.exe).Hash -ne '2a6add76c37bfa872eb8c2b22d45b3216b8e2a1f193e0774006340ff62ac5fa0') { throw 'Runtime installer differs from prepared tool pack' }
      - name: Diagnose absent WebView2 and isolated application startup
        shell: powershell
        run: ./runtime-diagnostics.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-startup-diagnostics
          path: C:/ReviewerRuntime/diagnostics
