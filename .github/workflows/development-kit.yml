name: offline-development-kit-acceptance
on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Encrypted private source release tag
        required: true
      source_key_secret:
        description: Optional isolated source key secret name
        required: false
      source_hash_secret:
        description: Optional isolated source checksum secret name
        required: false
      tools_run:
        description: Verified third-party tool preparation run ID
        required: true
      dependencies_run:
        description: Windows cached dependency preparation run ID
        required: true
        default: "37935184347"
      clean_fixture:
        description: Reset all preinstalled compiler and shared SDK caches on the disposable runner
        type: boolean
        default: false
jobs:
  acceptance:
    runs-on: windows-2022
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Download encrypted source, tools, and cached dependencies
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          TOOLS_RUN: ${{ inputs.tools_run }}
          DEPENDENCIES_RUN: ${{ inputs.dependencies_run }}
          SOURCE_ARCHIVE_KEY: ${{ secrets[inputs.source_key_secret || 'SOURCE_ARCHIVE_KEY'] }}
          SOURCE_ARCHIVE_SHA256: ${{ secrets[inputs.source_hash_secret || 'SOURCE_ARCHIVE_SHA256'] }}
        run: |
          gh release download $env:SOURCE_TAG --repo gongfpp/config-reviewer-builds --pattern source.enc --dir .
          python -m pip install --quiet cryptography
          python decrypt-source.py
          gh run download $env:TOOLS_RUN --repo gongfpp/config-reviewer-builds -n windows-offline-development-tools -D downloaded-tools
          if ($LASTEXITCODE -ne 0) { throw 'Tool download failed' }
          gh run download $env:DEPENDENCIES_RUN --repo gongfpp/config-reviewer-builds -n windows-offline-dependencies -D downloaded-deps
          if ($LASTEXITCODE -ne 0) { throw 'Dependency download failed' }
          python prepare-acceptance.py
          if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare isolated kit' }
      - name: Reset shared compiler and SDK caches on the disposable runner
        if: inputs.clean_fixture
        shell: powershell
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Disposable hosted runner required' }
          $cleanup = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/InstallCleanup.exe'
          if (-not (Test-Path $cleanup)) { throw 'Microsoft cleanup tool missing' }
          $p = Start-Process $cleanup -ArgumentList '-f' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Compiler/SDK fixture cleanup failed: $($p.ExitCode)" }
          if (Test-Path 'C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Tools/MSVC') { throw 'Preinstalled compiler files remain' }
          # The SDK can be registered independently of VS; remove its bundle as well.
          $sdkProducts = @(Get-ItemProperty 'HKLM:/SOFTWARE/Microsoft/Windows/CurrentVersion/Uninstall/*','HKLM:/SOFTWARE/WOW6432Node/Microsoft/Windows/CurrentVersion/Uninstall/*' -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -match 'Windows Software Development Kit.*19041' })
          foreach ($sdkProduct in $sdkProducts) {
            $command = $sdkProduct.UninstallString
            if ($command -match '^"([^"]+)"') {
              $p = Start-Process $matches[1] -ArgumentList @('/uninstall','/quiet','/norestart') -Wait -PassThru
            } elseif ($command -match 'MsiExec' -and $command -match '(\{[A-Fa-f0-9-]+\})') {
              $p = Start-Process msiexec.exe -ArgumentList @('/x',$matches[1],'/qn','/norestart') -Wait -PassThru
            } else { throw 'Cannot identify the SDK bundle uninstall command' }
            if ($p.ExitCode -notin @(0,3010)) { throw "SDK cleanup failed: $($p.ExitCode)" }
          }
          if (Test-Path 'C:/Program Files (x86)/Windows Kits/10/Include/10.0.19041.0') { throw 'SDK 19041 files remain; cannot claim a clean SDK fixture' }
      - name: Install tools, edit source, compile twice and test UI with development tool external traffic blocked
        shell: powershell
        run: |
          $monitor = Start-Process (Get-Command node.exe).Source -ArgumentList (Join-Path $PWD 'monitor-acceptance.mjs') -NoNewWindow -PassThru
          try { & 'C:/ReviewerKit/scripts/test-offline-development.ps1' }
          finally { Stop-Process -Id $monitor.Id -Force -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-development-kit-acceptance-evidence
          path: |
            C:/ReviewerKit/artifacts/dev-kit-test
            C:/ReviewerKit/artifacts/ui-smoke
            C:/ReviewerKit/.offline/install-logs
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiled-exe-diagnostics
          path: C:/ReviewerKit/src-tauri/target/x86_64-pc-windows-msvc/debug/config-reviewer.exe
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-development-kit-exe
          path: C:/ReviewerKit/ready-to-run/config-reviewer.exe
          if-no-files-found: error
